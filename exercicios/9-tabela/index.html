<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        thead{
            background-color: blue;
        }
        th , td{
            padding: 10px;
        }
    </style>
</head>
<body>
    <table border="1">
        <caption>Rotina Semanal</caption>
        <thead>
            <th>Domingo</th>
            <th>Segunda</th>
            <th>Terça</th>
            <th>quarta</th>
            <th>Quinta</th>
            <th>Sexta</th>
            <th>Sabado</th>
        </thead>
        <tbody>
            <tr>
                <td colspan="7" style="text-align: center; font-weight: bold; background-color: #f0f0f0;">Treinos</td>
            </tr>
            <tr>
                <td rowspan="2">Cardio</td>
                <td>Push</td>
                <td>Pull</td>
                <td>Legs</td>
                <td>Upper</td>
                <td>Lower</td>
                <td>Descanso</td>
            </tr>
             <tr>
                <td>Push</td>
                <td>Pull</td>
                <td>Legs</td>
                <td>Upper</td>
                <td>Lower</td>
                <td>Descanso</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
